# CI — gatepack core (§14, principle 7).
#
# Four jobs, one per layer of honesty:
#
#   * `test`             — the pure-Python floor: unit/golden/contract tests,
#                          shell harness, citation check, reproducibility, and
#                          the declared-manifest licence audit.  No GUI, no
#                          external toolchain, no PyInstaller, no electron.
#   * `toolchain`        — the ceiling: the toolchain tests are run *on the
#                          host*, where they drive `docker run gatepack-toolchain:m6`
#                          themselves.  A toolchain test that skips is a failure,
#                          because a skip is indistinguishable from the test not
#                          existing.
#   * `desktop-packaging` — the app: npm ci, version check, the bundled Python
#                          core (PyInstaller), the licence audit over the real
#                          npm tree *and* the bundle, the bundle acceptance test,
#                          the renderer/main typechecks and vitest, and an
#                          unsigned electron-builder package that is asserted to
#                          contain the core.
#   * `e2e`                — the Electron app driven for real: the Playwright
#                          suite (app/tests/e2e) launches the actual main
#                          process under xvfb and asserts the §5.2 security
#                          posture, the full IPC envelope contract, and the
#                          doctor/error/status-bar surfaces.  A test that cannot
#                          start Electron is a hard failure, and a skipped test
#                          fails the job — a skip is indistinguishable from the
#                          test not existing.
#
# The `toolchain` job exists because the floor has repeatedly reported green over
# machinery that had never touched a real tool: generated Verilog that Yosys
# rejected outright, properties asserted over undriven wires, and an equivalence
# check that errored out before comparing anything — each with a full suite
# passing.  Unit tests with fake runners cannot catch that class of defect.
# Only running the binaries can, which is why each of the three higher jobs is
# wired to fail if the thing it claims to measure does not actually run.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest

      # Explicitly the pure-Python layers: tests/toolchain is the ceiling's
      # business, and collecting it here would only ever skip it (a skip this
      # job is allowed to make, but a misleading one — so it is not made).
      - name: Unit, golden and contract tests
        run: .venv/bin/pytest tests/unit tests/golden tests/contract -q

      - name: Shell harness
        run: bash scripts/tests/run.sh

      - name: Library citation check
        run: .venv/bin/python -m gatepack.cli lib check libraries/74aup.csv

      - name: Reproducibility check
        run: .venv/bin/python scripts/repro_check.py

      - name: Licence audit (declared manifest)
        run: .venv/bin/python scripts/licence_audit.py

  toolchain:
    # Runs the real thing: Yosys 0.23, Icarus, sby and z3.  The tests in
    # tests/toolchain are written to run on the *host* — they `docker run` the
    # `gatepack-toolchain:m6` image themselves — so pytest runs here on the host,
    # not inside the container (the image carries no pytest and no docker).  This
    # job is allowed to be slow; it is not allowed to skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest

      - name: Build the measurement toolchain image
        run: docker build -f Dockerfile.probe -t gatepack-toolchain:m6 .

      - name: Toolchain-dependent tests (must not skip)
        run: |
          set -euo pipefail
          mkdir -p .gpout
          .venv/bin/pytest tests/toolchain -rs \
            --ignore=tests/toolchain/test_core_bundle.py \
            --ignore=tests/toolchain/test_packaging.py \
            2>&1 | tee .gpout/toolchain-pytest.log
          # A skip here means the image did not provide what the test needed,
          # which is indistinguishable from the test not existing.  Fail loudly.
          if grep -q "skipped" .gpout/toolchain-pytest.log; then
            echo "a toolchain test skipped; a skip is indistinguishable from the test not existing" >&2
            exit 1
          fi

      - name: Verify the goldens against real binaries
        run: |
          mkdir -p .gpout
          for d in xor2 decoder_3to8 traffic_light; do
            docker run --rm -v "$PWD:/repo" -w /repo gatepack-toolchain:m6 \
              bash -c "python3 -m gatepack verify tests/golden/designs/$d.yaml \
                         --library libraries/74aup.csv --build .gpout/$d"
          done

      - name: Reproducibility, including the mapped netlist
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo gatepack-toolchain:m6 \
            python3 scripts/repro_check.py

      - name: Showcase builds end to end
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo gatepack-toolchain:m6 \
            bash -c 'python3 -m gatepack build examples/pelican/design.yaml \
                       --library libraries/74aup.csv --out .gpout/pelican-out'

  desktop-packaging:
    # Builds the bundled Python core and the unpacked Electron app (unsigned),
    # audits the *installed* npm tree AND the bundle, and runs the app's own
    # tests.  The `test` job's licence audit can only see the 16-entry declared
    # manifest; this job sees the ~500 packages that actually ship in the
    # renderer/asar and the components that actually ship in the PyInstaller
    # binary.  `--require-node-tree` / `--require-bundle` make a missing input a
    # failure for the same reason the `toolchain` job fails on a skipped test:
    # an audit that ran over nothing is indistinguishable from one that did not
    # run.  `test_core_bundle.py` and `test_packaging.py` are run with their
    # preconditions satisfied (PyInstaller, GATEPACK_PACKAGING=1) so a skip here
    # is a real failure, not an expected one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install core + bundler
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pyinstaller pytest

      - name: Version consistency (core vs app)
        run: .venv/bin/python scripts/version_check.py

      - name: Build the bundled core (PyInstaller)
        run: .venv/bin/python scripts/bundle_core.py

      - name: Licence audit over installed tree + bundled core
        run: .venv/bin/python scripts/licence_audit.py --require-node-tree --require-bundle

      - name: Bundled-core acceptance test (must not skip)
        run: .venv/bin/pytest tests/toolchain/test_core_bundle.py -q

      - name: Typecheck (renderer + main)
        working-directory: app
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p tsconfig.main.json

      - name: Renderer + main tests (vitest)
        working-directory: app
        run: npx vitest run

      - name: Package unpacked Linux build and verify the core is inside (must not skip)
        # test_packaging.py does the app build + electron-builder itself and then
        # asserts resources/resources/bin/gatepack is present, executable, and
        # outside the asar — a real check on real output, not a config read.
        run: GATEPACK_PACKAGING=1 .venv/bin/pytest tests/toolchain/test_packaging.py -q

  windows-core:
    # The Windows half of the core bundle: PyInstaller does not cross-compile,
    # so `scripts/bundle_core.py` must run on a Windows host to produce
    # `gatepack.exe`. This job is the only place that path is exercised on a
    # real Windows runner — the release matrix runs the same build on
    # windows-latest, but only on tag pushes. It is *not* runnable on Linux:
    # the acceptance test pins `gatepack.exe` naming and the `.exe`-aware
    # environment scrub. UNVERIFIED: this job is written against the GitHub
    # Actions Windows runner contract and has never been executed here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core + bundler
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller pytest

      - name: Build the bundled core (PyInstaller -> gatepack.exe)
        run: python scripts/bundle_core.py

      - name: Bundled-core acceptance test (must not skip)
        run: python -m pytest tests/toolchain/test_core_bundle.py -q

  e2e:
    # The app tested end to end: Playwright drives the real Electron main
    # process (`_electron.launch`, no downloaded Playwright browser — the suite
    # uses Electron directly) under xvfb.  The suite ships its own hermetic fake
    # core (app/tests/e2e/fake-core.cjs) for the bridge-level specs and uses the
    # real Python core (`.venv/bin/python`) for the GUI-audit regressions, so
    # this job installs the core as well as the app.  Electron failing to start
    # is a real failure (the launch throws, Playwright reports it, and no `||
    # true` anywhere swallows it); a skipped test is also a failure, for the same
    # reason the toolchain job treats a skip as "the test did not run".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install core (for the real-core GUI-audit specs)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .

      - name: Build main + renderer
        working-directory: app
        run: |
          npm run build:main
          npx vite build

      - name: Electron end-to-end tests (must not skip)
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p ../.gpout
          xvfb-run -a npx playwright test --config playwright.config.cjs 2>&1 | tee ../.gpout/e2e.log
          # A skip here means the suite did not really exercise what it claims
          # to (the GUI-audit specs skip when the real core is missing), which is
          # indistinguishable from the test not existing.  Fail loudly.
          if grep -qi "skipped" ../.gpout/e2e.log; then
            echo "an e2e test skipped; a skip is indistinguishable from the test not existing" >&2
            exit 1
          fi
