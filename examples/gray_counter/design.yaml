# ---------------------------------------------------------------------------
# A 2-bit Gray-code counter — the glitch-free count, with `encoding: gray`.
#
# A binary counter changes several bits at once on some steps (01 -> 10 flips
# both), so a logic block decoding the count can see a wrong value for a
# fraction of a clock. A Gray-code counter changes exactly one bit per step, so
# no intermediate code is ever visible. This example is the one place in the
# set that uses the `gray` state encoding rather than the default `one_hot`: the
# two-bit state register itself counts 00 -> 01 -> 11 -> 10, one bit at a time,
# and the outputs decode that register back to the 2-bit value.
#
# What it demonstrates:
#
#   encoding: gray        the state register is a genuine 2-bit Gray counter
#   four-state cycle       G00 -> G01 -> G11 -> G10 -> G00, guarded by `en`
#   one bit per step       every adjacent pair of states differs in one flop
#   decode outputs         g1/g0 surface the Gray value; the observer sees the
#                          count, never a glitching intermediate code
#   enable input           a counter that only advances when told to
#
# The Gray sequence 00, 01, 11, 10 is the canonical textbook order; the states
# are named after their Gray codes so the cycle is visible in the state list.
#
# Synthetic, written for this project (§1.3). The Gray sequence is common
# property; nothing is derived from any product or datasheet application note.
# ---------------------------------------------------------------------------
name: gray_counter
timing_model: synchronous

clock: {signal: clk, freq_hz: 1000, source: OSC}

reset:
  signal: rst_n
  active: low
  source: SUPERVISOR

encoding: gray

inputs:
  # A clocked count-enable; combinational, so no synchroniser (§9.3).
  - {name: en, sync: false}

outputs:
  - {name: g1}
  - {name: g0}

states: [G00, G01, G11, G10]
initial: G00

transitions:
  # Advance around the Gray cycle while `en` is high; hold otherwise.
  - {from: G00, to: G01, when: "en"}
  - {from: G00, to: G00, when: "!en"}
  - {from: G01, to: G11, when: "en"}
  - {from: G01, to: G01, when: "!en"}
  - {from: G11, to: G10, when: "en"}
  - {from: G11, to: G11, when: "!en"}
  - {from: G10, to: G00, when: "en"}
  - {from: G10, to: G10, when: "!en"}

output_logic:
  # The 2-bit Gray value: g1 is the high bit, g0 the low bit.
  g1: "state == G11 | state == G10"
  g0: "state == G01 | state == G11"
