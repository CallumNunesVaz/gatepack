# ---------------------------------------------------------------------------
# A three-input even-parity generator — the purely combinational case.
#
# Parity is the smallest circuit where "what the tool is doing" is visible in
# the schematic without reading a specification first: three data bits go in,
# one bit comes out that is 1 exactly when an odd number of the inputs are 1.
# There is no state to step through, so the whole design is a single state S0
# with one self-transition and every interesting expression in output_logic.
#
# What it demonstrates:
#
#   states: [S0]        a machine with no past — output depends on inputs alone
#   output_logic        an XOR tree (a ^ b ^ c) mapped to two 74AUP 1G86 gates
#   truth table         2^3 = 8 rows, exhaustively checkable
#   verification        equivalence + exhaustive simulation over 8 input vectors
#
# Parity is also the seed of error detection (a single bit-flip changes the
# parity), which is worth saying out loud: this is the arithmetic core of an
# ECC check bit, not a toy.
#
# Synthetic, written for this project (§1.3). Nothing here is derived from any
# real product or datasheet application note.
# ---------------------------------------------------------------------------
name: parity
timing_model: synchronous

# A nominal 1 kHz data clock: fast enough that the timing figures are not
# absurd, slow enough to read the report's static-current number honestly.
clock: {signal: clk, freq_hz: 1000, source: OSC}

reset:
  signal: rst_n
  active: low
  source: SUPERVISOR

encoding: one_hot

inputs:
  # Combinational inputs come from a clocked source, so no synchroniser is
  # needed (§9.3): sync: false is the honest declaration, not an omission.
  - {name: a, sync: false}
  - {name: b, sync: false}
  - {name: c, sync: false}

outputs:
  - {name: y}

states: [S0]
initial: S0

transitions:
  - {from: S0, to: S0, when: "1"}

output_logic:
  y: "a ^ b ^ c"
