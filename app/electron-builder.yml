# electron-builder configuration for the gatepack desktop application (§17).
#
# This config is deliberately credential-free: no identity, no certificate, no
# notarisation credential is present, because none has been provisioned and this
# project never fabricates values it cannot verify.  Signing is *wired* below —
# hardened runtime, entitlements, `notarize: true`, and the Authenticode path —
# and driven entirely by the environment secrets documented in
# docs/RELEASING.md (`CSC_LINK`, `CSC_KEY_PASSWORD`, `APPLE_ID`,
# `APPLE_APP_SPECIFIC_PASSWORD`, `APPLE_TEAM_ID`).  Absent those secrets the
# targets build *unsigned* and the build logs say so; until they are supplied,
# macOS/Windows installers are produced but will trip Gatekeeper / SmartScreen.
# Signing is not merely *configured*: the release workflow runs
# `scripts/verify_signing.py` against the result (codesign/spctl/stapler on
# macOS, signtool verify /pa /v on Windows) and fails the release if the
# artefact is not actually signed — a signed build that is not verified is not
# signed.
#
#
# What ships and how (§17, §4):
#   * `dist/` — the compiled main (tsc), preload (tsc) and renderer (vite)
#     processes.  The renderer bundle is self-contained (React, monaco, elkjs,
#     netlistsvg, reactflow, zod are all baked in by vite).
#   * production `node_modules` — electron-builder collects these automatically.
#     The main process requires `zod` at runtime (dist/main/envelope.cjs
#     validates IPC payloads against the §5.2 schemas), so the tree cannot be
#     excluded wholesale.  This is also what scripts/licence_audit.py audits as
#     the "shipped" set.
#   * `resources/bin/` — §17's reserved location for the bundled Python core and
#     the native toolchain (yosys, sby, espresso, iverilog).  The Python core is
#     produced by `scripts/bundle_core.py` (a PyInstaller onefile binary), which
#     makes the extraResources/asarUnpack entries below live.  The native
#     toolchain is NOT bundled yet — see docs/RELEASING.md "The native
#     toolchain" — so a packaged app without a host toolchain still reports each
#     missing tool legibly (`gatepack doctor`, `gatepack build`).

appId: io.github.callumnunesvaz.gatepack
productName: gatepack
copyright: "GPL-3.0-or-later"

directories:
  # Keep build artefacts out of app/dist (the compiled app lives there).
  output: ../.gpout/dist
  # electron-builder takes the application icon from here by convention:
  # build/icon.png (Linux/macOS) and build/icon.ico (Windows). Both are copies
  # of the assets in media/ — see media/README.md for how they are generated.
  buildResources: build

files:
  - dist/**/*
  - package.json
  # electron-builder collects production node_modules automatically; do not
  # exclude it wholesale (main requires zod at runtime).  The renderer bundle
  # (vite) is self-contained, so everything below is dead weight at runtime and
  # excluded so that what ships matches what runs:
  #
  #   * netlistsvg's CLI subtree (yargs@6 and its read-pkg/spdx/ajv/os-locale
  #     dependency closure).  The renderer imports netlistsvg's library entry
  #     (built/index.js), which only needs elkjs/onml/clone/lodash — none of the
  #     CLI.  This subtree is what drags `spdx-exceptions` (CC-BY-3.0, not
  #     GPL-compatible) into the asar; excluding it removes that finding.
  #   * the top-level `elkjs@0.9.3` (EPL-2.0) declared in package.json.  Nothing
  #     imports it: netlistsvg resolves its own nested `elkjs@0.3.0` (EPL-1.0),
  #     which is the copy the renderer bundle actually embeds.  That nested copy
  #     is deliberately NOT excluded so scripts/licence_audit.py keeps an
  #     automated signal that the shipped elkjs is EPL-1.0 (see
  #     docs/BUILD-NOTES-licence2.md).
  #
  # scripts/licence_audit.py reads these same excludes, so its "shipped" set
  # tracks the asar exactly.  Keep the two in sync by hand.
  - "!node_modules/netlistsvg/node_modules/ansi-regex/**"
  - "!node_modules/netlistsvg/node_modules/cliui/**"
  - "!node_modules/netlistsvg/node_modules/fs-extra/**"
  - "!node_modules/netlistsvg/node_modules/get-caller-file/**"
  - "!node_modules/netlistsvg/node_modules/is-fullwidth-code-point/**"
  - "!node_modules/netlistsvg/node_modules/json5/**"
  - "!node_modules/netlistsvg/node_modules/jsonfile/**"
  - "!node_modules/netlistsvg/node_modules/string-width/**"
  - "!node_modules/netlistsvg/node_modules/strip-ansi/**"
  - "!node_modules/netlistsvg/node_modules/wrap-ansi/**"
  - "!node_modules/netlistsvg/node_modules/y18n/**"
  - "!node_modules/netlistsvg/node_modules/yargs/**"
  - "!node_modules/netlistsvg/node_modules/yargs-parser/**"
  - "!node_modules/ajv/**"
  - "!node_modules/ajv-errors/**"
  - "!node_modules/camelcase/**"
  - "!node_modules/code-point-at/**"
  - "!node_modules/decamelize/**"
  - "!node_modules/elkjs/**"
  - "!node_modules/error-ex/**"
  - "!node_modules/es-errors/**"
  - "!node_modules/fast-deep-equal/**"
  - "!node_modules/fast-json-stable-stringify/**"
  - "!node_modules/find-up/**"
  - "!node_modules/function-bind/**"
  - "!node_modules/graceful-fs/**"
  - "!node_modules/hasown/**"
  - "!node_modules/invert-kv/**"
  - "!node_modules/is-arrayish/**"
  - "!node_modules/is-core-module/**"
  - "!node_modules/is-utf8/**"
  - "!node_modules/json-schema-traverse/**"
  - "!node_modules/klaw/**"
  - "!node_modules/lcid/**"
  - "!node_modules/load-json-file/**"
  - "!node_modules/normalize-package-data/**"
  - "!node_modules/normalize-package-data/node_modules/hosted-git-info/**"
  - "!node_modules/normalize-package-data/node_modules/semver/**"
  - "!node_modules/number-is-nan/**"
  - "!node_modules/os-locale/**"
  - "!node_modules/parse-json/**"
  - "!node_modules/path-exists/**"
  - "!node_modules/path-parse/**"
  - "!node_modules/path-type/**"
  - "!node_modules/pify/**"
  - "!node_modules/pinkie/**"
  - "!node_modules/pinkie-promise/**"
  - "!node_modules/punycode/**"
  - "!node_modules/read-pkg/**"
  - "!node_modules/read-pkg-up/**"
  - "!node_modules/require-directory/**"
  - "!node_modules/require-main-filename/**"
  - "!node_modules/resolve/**"
  - "!node_modules/set-blocking/**"
  - "!node_modules/spdx-correct/**"
  - "!node_modules/spdx-exceptions/**"
  - "!node_modules/spdx-expression-parse/**"
  - "!node_modules/spdx-license-ids/**"
  - "!node_modules/strip-bom/**"
  - "!node_modules/supports-preserve-symlinks-flag/**"
  - "!node_modules/uri-js/**"
  - "!node_modules/validate-npm-package-license/**"
  - "!node_modules/which-module/**"

asar: true
asarUnpack:
  # Native binaries must live outside the asar to be executable.
  - resources/bin/**

extraResources:
  # The bundled Python core (§17: app/resources/bin/gatepack), produced by
  # scripts/bundle_core.py.  Native binaries must live outside the asar to be
  # executable, hence the matching asarUnpack entry.
  - from: resources
    to: resources
    filter:
      - "**/*"

linux:
  target:
    - target: AppImage
    - target: deb
  category: Development
  # deb REQUIRES a maintainer field, so this cannot simply be omitted. It is a
  # placeholder: publishing a personal address in a public package is the
  # maintainer's decision, not a default. Set it before cutting a deb.
  maintainer: gatepack maintainers <maintainers@gatepack.invalid> # TODO: real contact
  homepage: https://github.com/CallumNunesVaz/gatepack

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
  # No `arch` is listed here: electron-builder builds the *host* architecture
  # by default, and PyInstaller does not cross-compile either, so each macOS
  # architecture is a separate release-matrix runner — arm64 on macos-14,
  # x64 on macos-13 (see .github/workflows/release.yml).  Listing both arches
  # here would ask one runner to build for a foreign arch, which is exactly the
  # "clever flag instead of a build matrix" trap the release avoids.
  # Signing is *configured but not populated* — there is no identity, cert or
  # notarisation credential in this tree, and none is fabricated.  Every value
  # is driven by environment secrets at build time; absent them the build
  # succeeds *unsigned* and says so in its output, never failing obscurely and
  # never silently skipping:
  #
  #   * `CSC_LINK` / `CSC_KEY_PASSWORD` — a Developer ID Application cert
  #     (base64-encoded .p12 + its password).  electron-builder imports it and
  #     codesigns the .app with the hardened runtime below.  Absent, it logs
  #     "skipped macOS application code signing" and continues.
  #   * `APPLE_ID` / `APPLE_APP_SPECIFIC_PASSWORD` / `APPLE_TEAM_ID` — the
  #     notarytool credentials.  `notarize: true` below is safe to leave set:
  #     electron-builder only submits when these three are all present, and
  #     logs "skipped macOS notarization" otherwise (verified against
  #     app-builder-lib's getNotarizeOptions).
  #
  # `identity` is deliberately *unset* (not `null`): `null` would hard-disable
  # signing even when CSC_LINK is present, and the whole point is that signing
  # becomes a pure secrets-supply step.  Auto-discovery (`CSC_IDENTITY_AUTO_DISCOVERY`)
  # is the mechanism; the release workflow sets it `false` on the unsigned path
  # to avoid keychain scanning, and leaves it unset on the signed path.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: signing/entitlements.mac.plist
  entitlementsInherit: signing/entitlements.mac.plist
  notarize: true

win:
  target:
    - target: nsis
  # Authenticode signing is driven entirely by the same `CSC_LINK` /
  # `CSC_KEY_PASSWORD` secrets (electron-builder reads `WIN_CSC_LINK` with a
  # `CSC_LINK` fallback).  Absent them it logs "no signing information identified,
  # signing is skipped" and produces an unsigned installer; present, it signs
  # with signtool (sha1+sha256).  Nothing here fabricates a certificate.
  #
  # Windows toolchain note: the Windows installer ships the PyInstaller core
  # (`resources/bin/gatepack.exe`, built by `scripts/bundle_core.py` on a
  # Windows host — PyInstaller cannot cross-compile), but NO native toolchain.
  # `scripts/bundle_toolchain.py` bundles Linux x86-64 ELF binaries and refuses
  # to run on a non-Linux host; the Windows app therefore reports each missing
  # tool honestly and `gatepack doctor` names where a Windows user gets it
  # (OSS CAD Suite, or WSL2 — see docs/WINDOWS.md).

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish: null # no auto-update, no telemetry (§5.2); nothing is uploaded anywhere
