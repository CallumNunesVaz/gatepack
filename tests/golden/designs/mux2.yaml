# A combinational 2:1 multiplexer, expressed in the expression language's
# AND/OR/NOT subset: y = (a & !s) | (b & s).  With the MUX2 cell in the
# Liberty, synthesis maps this onto the 74AUP1G157 instead of an AND/OR/NOT
# tree — the reachability check for the new cell (see
# tests/toolchain/test_mux2_reachable.py).
name: mux2
timing_model: synchronous
clock: {signal: clk, freq_hz: 1000, source: OSC}
reset: {signal: rst_n, active: low, source: SUPERVISOR}
encoding: one_hot
inputs:
  - {name: a, sync: false}
  - {name: b, sync: false}
  - {name: s, sync: false}
outputs:
  - {name: y}
states: [S0]
initial: S0
transitions:
  - {from: S0, to: S0, when: "1"}
output_logic:
  y: "(!s & a) | (s & b)"
